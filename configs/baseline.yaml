seed: 42

data:
  data_dir: data/raw/mapgeneralizer/data/input
  feature_set: xy
  max_vertices: 32
  normalize_movement: true
  validate_on_load: true

model:
  name: mlp
  hidden_dim: 96
  num_layers: 3
  dropout: 0.10
  num_heads: 4
  feedforward_dim: 256
  relative_bias: false
  geometric_bias: false

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  movement_loss_weight: 0.0
  class_weighting: balanced
  gradient_clip_norm: 1.0
  patience: 10
  num_workers: 0
  device: auto

output:
  output_dir: outputs/baseline
  save_predictions: true
